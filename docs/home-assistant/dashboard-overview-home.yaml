        stat_type: change
        unit: €
        period:
          calendar:
            period: day
            offset: 0
      - type: statistic
        entity: sensor.meter_reading_cost
        name: Bezugskosten Monat
        icon: mdi:calendar-month
        stat_type: change
        unit: €
        period:
          calendar:
            period: month
            offset: 0
    - type: entities
      entities:
      - entity: sensor.meter_reading
        name: Bezogen von EVU gesamt
      - entity: sensor.sbt_victron_yield_today_display_kwh
        name: 'PV today: last receipt (Victron)'
      - entity: sensor.tasmota_smartplug_12_energy_today
        name: 'PV + Batterie: AC-Abgabe heute'
      - entity: sensor.solar_self_consumption_power
        name: Eigenverbrauch aus PV + Batterie
      - entity: sensor.money_saved_rate
        name: PV-Ersparnis aktuell
    - type: horizontal-stack
      cards:
      - type: entity
        entity: sensor.money_saved_daily
        name: PV-Ersparnis heute
        icon: mdi:currency-eur
        unit: €
      - type: entity
        entity: sensor.money_saved_monthly
        name: PV-Ersparnis Monat
        icon: mdi:calendar-month
        unit: €
    - type: entities
      entities:
      - entity: sensor.helper_daily_daily_energy_gifted
        name: Netzeinspeisung heute
      - entity: sensor.meter_reading_out
        name: Netzeinspeisung gesamt
    grid_options:
      columns: full
- type: grid
  cards:
  - type: custom:apexcharts-card
    header:
      show: true
    graph_span: 96h
    span:
      start: day
    now:
      show: true
      label: Now
    color_list:
    - var(--primary-color)
    series:
    - entity: sensor.epex_spot_data_total_price_2
      yaxis_id: uurprijs
      float_precision: 3
      type: column
      extend_to: false
      show:
        extremas: time
      data_generator: |
        const data = entity.attributes.data ?? [];
        const startWindow = new Date();
        startWindow.setHours(0, 0, 0, 0);

        const endWindow = startWindow.getTime() + 96 * 60 * 60 * 1000;

        return data
          .filter(entry => {
            const start = new Date(entry.start_time).getTime();
            return start >= startWindow.getTime() && start < endWindow;
          })
          .map(entry => [
            new Date(entry.start_time).getTime(),
            Number(entry.price_per_kwh)
          ]);
      color_threshold:
      - value: 0
        color: '#186ddc'
      - value: 0.155
        color: '#04822e'
      - value: 0.2
        color: '#12A141'
      - value: 0.25
        color: '#79B92C'
      - value: 0.3
        color: '#C4D81D'
      - value: 0.35
        color: '#F3DC0C'
      - value: 0.4
        color: red
      - value: 0.5
        color: magenta
    experimental:
      color_threshold: true
    yaxis:
    - id: uurprijs
      decimals: 3
      apex_config:
        title:
          text: €/kWh
        tickAmount: 4
    apex_config:
      legend:
        show: false
      tooltip:
        x:
          show: true
          format: dd.MM. HH:mm
      xaxis:
        type: datetime
        labels:
          datetimeUTC: false
    grid_options:
      columns: full
  column_span: 2
