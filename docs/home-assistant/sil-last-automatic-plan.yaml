# Optional Home Assistant package for display only. Do not use this entity for control.
# Install only after owner approval, alongside the existing discharge budget sensor.
template:
  - triggers:
      - trigger: state
        entity_id: sensor.solarlimiter_discharge_budget
    conditions:
      - condition: template
        value_template: >-
          {% set s = trigger.to_state %}
          {% set a = s.attributes if s is not none else {} %}
          {% set g = a.get('g') %}
          {% set t = a.get('t') %}
          {% set n = a.get('n') %}
          {% set w = a.get('w') %}
          {% set check = namespace(valid=true) %}
          {% if w is sequence and w is not string %}
            {% for value in w %}
              {% if value is not number or value is boolean or value != (value | int(-1)) or value < 0 or value > 12000 %}
                {% set check.valid = false %}
              {% endif %}
            {% endfor %}
          {% else %}
            {% set check.valid = false %}
          {% endif %}
          {{ s is not none and s.state == 'ready' and a.get('valid') == true
             and a.get('v') == 1 and g is number and g is not boolean
             and t is number and t is not boolean and n is number and n is not boolean
             and g == (g | int(-1)) and t == (t | int(-1)) and n == (n | int(-1))
             and 2 <= n <= 144 and a.get('d') == 900 and t % 900 == 0
             and t <= g < t + 900 and -120 <= as_timestamp(now()) - g < 180
             and as_timestamp(now()) < t + n * 900
             and check.valid and w | length == n }}
    sensor:
      - name: SIL Last Automatic Discharge Budget
        unique_id: sil_last_automatic_discharge_budget
        state: "{{ trigger.to_state.attributes.g }}"
        attributes:
          g: "{{ trigger.to_state.attributes.g }}"
          t: "{{ trigger.to_state.attributes.t }}"
          d: "{{ trigger.to_state.attributes.d }}"
          n: "{{ trigger.to_state.attributes.n }}"
          w: "{{ trigger.to_state.attributes.w }}"
