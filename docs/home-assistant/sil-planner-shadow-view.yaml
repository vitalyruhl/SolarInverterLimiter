              \ 3}) + ' EUR/kWh') + '</strong>'];\n  }\n  if (opts.seriesIndex === 5) return [];\n  const value = values.length\
              \ ? values[values.length - 1] : null;\n  return [name + ':', '<strong>' +\n    (Number.isFinite(value) ? value.toLocaleString(undefined,\n\
              \      {maximumFractionDigits: 0}) : 'N/A') + ' W</strong>'];\n}"
