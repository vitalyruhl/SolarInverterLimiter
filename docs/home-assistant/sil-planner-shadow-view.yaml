            \ => value !== null &&\n      (!Number.isInteger(value) || value < 0 || value > 12000))) return [];\nconst generatedMs\
            \ = a.g * 1000;\nconst coverageEnd = (a.t + a.n * a.d) * 1000;\nif (nowMs - generatedMs > 180000 || generatedMs\
            \ - nowMs > 120000 ||\n    nowMs >= coverageEnd) return [];\nconst values = a.s;\nconst points = [];\nfor (let\
            \ i = 0; i < a.n; ++i) {\n  const intervalStart = (a.t + i * a.d) * 1000;\n  const intervalEnd = intervalStart\
            \ + a.d * 1000;\n  const at = Math.max(intervalStart, generatedMs, windowStart, nowMs);\n  const end = Math.min(intervalEnd,\
