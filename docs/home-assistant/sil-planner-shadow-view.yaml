          type: line
          color: '#00000000'
          opacity: 0
          stroke_width: 0
          extend_to: false
          show:
            in_chart: true
            in_legend: false
            in_header: false
            extremas: false
            datalabels: false
          data_generator: "if (!entity || ['unknown', 'unavailable', ''].includes(entity.state)) return [];\nconst limit =\
            \ Number(entity.state);\nconst a = entity.attributes;\nif (!a || a.v !== 1 || a.valid !== true ||\n    typeof\
            \ a.maxOutputW !== 'number' || !Number.isInteger(a.maxOutputW) ||\n    !Number.isInteger(limit) || limit <= 0\
            \ || limit > 2147483647 ||\n    limit !== a.maxOutputW) return [];\nconst windowStart = start.getTime();\nconst\
            \ windowEnd = end.getTime();\nif (!Number.isFinite(windowStart) || !Number.isFinite(windowEnd) ||\n    windowEnd\
            \ <= windowStart) return [];\nreturn [[windowStart, limit + 100], [windowEnd, limit + 100]];\n"
