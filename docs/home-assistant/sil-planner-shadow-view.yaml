        %}{% set pc=''sensor.sil_comparison_production_config'' %}{% set i=''sensor.sil_shadow_price_input'' %}

        {% set test_current = states(a)==''ready'' and state_attr(a,''g'') is number and 0 <= as_timestamp(now())-state_attr(a,''g'')
        < 180 %}

        {% set input_current = states(i)==''ready'' and state_attr(i,''lastPublishedAt'') is number and 0 <= as_timestamp(now())-state_attr(i,''lastPublishedAt'')
        < 180 %}

        **Stand Produktion:** {% if state_attr(p,''received_at'') is number %}{{ state_attr(p,''received_at'') | timestamp_custom(''%d.%m.
        %H:%M:%S'') }}{% else %}noch keine Daten{% endif %}.

        **Stand Test:** {% if test_current and input_current %}{{ state_attr(a,''g'') | timestamp_custom(''%d.%m. %H:%M:%S'')
