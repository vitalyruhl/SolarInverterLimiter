  - type: markdown
    title: Prüfdetails
    content: '## TEST - diagnostic comparison only

      No hardware commands. Production keeps its existing planner.

      Separate controllers have separate measured battery ledgers and cache histories. Differences are not automatically an
      algorithm improvement.


      {% set a=''sensor.sil_shadow_assessment'' %}{% set p=''sensor.sil_comparison_production_state'' %}{% set c=''sensor.sil_shadow_config''
      %}{% set pc=''sensor.sil_comparison_production_config'' %}{% set i=''sensor.sil_shadow_price_input'' %}

      **Test feed:** {{ states(i) }} / {{ state_attr(i,''reason'') or ''aligned raw tariff'' }}

      **Provider fetch age:** {{ state_attr(i,''providerAgeS'') }} s; source request interval 3600 s. This is transport age,
      not price finality.

      **Alignment evidence:** {{ state_attr(i,''firstMismatch'') or ''no mismatch reported'' }}; next allowed source request
      {{ state_attr(i,''nextProviderRequestAt'') }}.

      **Origin slots:** market {{ state_attr(i,''originMarket'') }}, forecast {{ state_attr(i,''originForecast'') }}, **unknown
      {{ state_attr(i,''originUnknown'') }}**.

      **Test output:** {{ states(a) }}; generated {{ state_attr(a,''g'') }}; age {% if state_attr(a,''g'') is number %}{{
      (as_timestamp(now()) - state_attr(a,''g''))|round(0) }} s{% else %}unknown{% endif %}.

      **Input binding:** {% if states(i)==''ready'' and states(a)==''ready'' and state_attr(i,''r'')==state_attr(a,''priceRevision'')
      and state_attr(i,''t'')==state_attr(a,''priceStart'') and state_attr(i,''n'')==state_attr(a,''priceSlots'') %}MATCHED{%
      else %}**MISSING / DIFFERENT REVISION - assessment curve withheld**{% endif %}.

      **Test hardware:** mocked {{ state_attr(a,''mockTransport'') }}, shadow profile {{ state_attr(a,''shadowProfile'') }}.


      | Quantity | Production | Shadow TEST |

      |---|---:|---:|

      | Available battery Wh | {{ state_attr(p,''availableWh'') }} | {{ state_attr(a,''availableWh'') }} |

      | Maximum output W | {{ state_attr(pc,''maxOutputW'') }} | {{ state_attr(c,''maxOutputW'') }} |

      | Deferral tolerance EUR/kWh | {{ state_attr(pc,''deferralToleranceEurKwh'') if state_attr(pc,''deferralToleranceEurKwh'')
      is not none else ''0.03 (5.6.3 baseline)'' }} | {{ state_attr(c,''deferralToleranceEurKwh'') }} |

      | Forecast premium % | {{ state_attr(pc,''predictionPremiumPct'') if state_attr(pc,''predictionPremiumPct'') is not
      none else ''0 (5.6.3 baseline)'' }} | {{ state_attr(c,''predictionPremiumPct'') }} |

      | Reserve off/on % | {{ state_attr(pc,''resOff'') }} / {{ state_attr(pc,''resOn'') }} | {{ state_attr(c,''resOff'')
      }} / {{ state_attr(c,''resOn'') }} |

      | Price factor | {{ state_attr(pc,''fcPriceF'') }} | {{ state_attr(c,''fcPriceF'') }} |

      | Full capacity Ah | {{ states(''sensor.sbt_bms_full_capacity_ah'') }} | {{ state_attr(a,''fullCapacityAh'') }} |

      | BMS SoC % | {{ states(''sensor.sbt_bms_state_of_charge_pct'') }} | {{ state_attr(a,''soc'') }} |

      | Battery power W | {{ states(''sensor.sbt_bms_power_w'') }} | {{ state_attr(a,''batteryW'') }} |

      | BMS sample sequence | {{ state_attr(''sensor.sbt_bms_health'',''sample_sequence'') }} | {{ state_attr(a,''bmsSequence'')
      }} |

      | Charger sample sequence | {{ state_attr(''sensor.sbt_victron_health'',''sample_sequence'') }} | {{ state_attr(a,''chargerSequence'')
      }} |


      {% set prod=state_attr(p,''availableWh'') %}{% set test=state_attr(a,''availableWh'') %}

      **Available-energy difference (TEST minus production):** {% if is_number(prod) and is_number(test) %}{{ (test|float
      - prod|float)|round(1) }} Wh{% else %}unknown{% endif %}.

      **Production state age:** {{ (as_timestamp(now()) - (state_attr(p,''received_at'')|float(0)))|round(0) }} s; retained
      {{ state_attr(p,''retained'') }}.

      Raw prices remain the tariff. The orange curve is a planning assessment only; unknown origin is never promoted by a
      clock heuristic.

      '
