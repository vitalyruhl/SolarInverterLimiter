            \ ?? [])\n  .filter(entry => {\n    const at = new Date(entry.start_time).getTime();\n    return at >= windowStart\
            \ && at < windowEnd;\n  })\n  .map(entry => [new Date(entry.start_time).getTime(), entry.price_per_kwh]);\n"
