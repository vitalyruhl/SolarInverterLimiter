title: SIL Prod/Test
path: sil-planner-comparison
icon: mdi:flask-outline
type: panel
cards:
- type: vertical-stack
  cards:
  - type: markdown
    content: '## SIL Prod/Test · 36 Stunden

      **Der Test steuert keine Geräte.** Die Produktion verwendet weiter die bisherige Planung.'
  - type: markdown
    content: '### Original aus Overview · Produktion

      Unveränderte Kopie der Produktionsanzeige.

      {% set a=''sensor.sil_shadow_assessment'' %}{% set stamp=state_attr(a,''g'') %}

      {% if states(a)==''ready'' and stamp is number and 0 <= as_timestamp(now())-stamp < 180 %}

      Die neue Berechnung steht separat unten im Testvergleich.

      {% else %}

      **Die neue Berechnung wartet auf den Test-ESP.** Die Originalkurve zeigt weiterhin die Produktion.

      {% endif %}'
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - condition: screen
        media_query: '(min-width: 768px)'
      card:
        type: custom:apexcharts-card
        header:
          show: true
          title: Strompreis und Entladeplan (36 h)
          show_states: false
        graph_span: 39h
        span:
          start: minute
          offset: -3h
        now:
          show: true
          label: Now
        series:
        - entity: sensor.sil_current_discharge_plan
          name: Entladeplan
          yaxis_id: discharge_w
          unit: W
          float_precision: 0
          type: line
          curve: stepline
          color: '#ef5350'
          stroke_width: 1
          extend_to: now
          fill_raw: 'null'
          group_by:
            func: raw
          show:
            extremas: false
        - entity: sensor.solarlimiter_discharge_budget
          name: Entladebudget (Batterie)
          yaxis_id: discharge_w
          unit: W
          float_precision: 0
          type: area
          curve: stepline
          color: '#ef5350'
          opacity: 0.22
          stroke_width: 1
          extend_to: false
          show:
            extremas: false
          data_generator: "const windowStart = start.getTime();\nconst windowEnd = end.getTime();\nconst nowMs = Date.now();\n\
            const a = entity.attributes;\nif (entity.state !== 'ready' || a.valid !== true || a.v !== 1 ||\n    !Number.isInteger(a.g)\
            \ || !Number.isInteger(a.t) || a.d !== 900 ||\n    !Number.isInteger(a.n) || a.n < 2 || a.n > 144 ||\n    !Array.isArray(a.w)\
            \ || a.w.length !== a.n ||\n    a.t % 900 !== 0 || a.g < a.t || a.g >= a.t + a.d ||\n    a.w.some(w => !Number.isInteger(w)\
            \ || w < 0)) return [];\nconst generatedMs = a.g * 1000;\nconst coverageEnd = (a.t + a.n * a.d) * 1000;\nif (nowMs\
            \ - generatedMs > 180000 || generatedMs - nowMs > 120000 ||\n    nowMs >= coverageEnd) return [];\nconst points\
            \ = [];\nfor (let i = 0; i < a.n; ++i) {\n  const intervalStart = (a.t + i * a.d) * 1000;\n  const intervalEnd\
            \ = intervalStart + a.d * 1000;\n  const at = Math.max(intervalStart, generatedMs, windowStart, nowMs);\n  if\
            \ (intervalEnd <= at || at >= windowEnd) continue;\n  points.push([at, a.w[i]]);\n}\nif (points.length) {\n  const\
            \ end = Math.min(coverageEnd, windowEnd);\n  const last = points[points.length - 1];\n  if (end > last[0]) points.push([end,\
            \ last[1]]);\n}\nreturn points;\n"
        - entity: sensor.solarlimiter_charge_plan
          name: PV Vorhalten
          yaxis_id: solar_dc
          unit: W
          float_precision: 0
          type: area
          curve: stepline
          color: '#42a5f5'
          opacity: 0.2
          stroke_width: 1
          extend_to: false
          show:
            extremas: false
          data_generator: "const nowMs = Date.now();\nconst windowStart = start.getTime();\nconst windowEnd = end.getTime();\n\
            const a = entity?.attributes;\nif (entity?.state !== 'ready' || !a || a.valid !== true || a.v !== 1 ||\n    !Number.isInteger(a.g)\
            \ || !Number.isInteger(a.t) || a.d !== 900 ||\n    !Number.isInteger(a.n) || a.n < 2 || a.n > 144 ||\n    a.t\
            \ % 900 !== 0 || a.g < a.t || a.g >= a.t + a.d) return [];\nif (a.kind !== 'intent_projection' ||\n    !Array.isArray(a.w)\
            \ || a.w.length !== a.n ||\n    !Array.isArray(a.s) || a.s.length !== a.n ||\n    [...a.w, ...a.s].some(value\
            \ => value !== null &&\n      (!Number.isInteger(value) || value < 0 || value > 12000))) return [];\nconst generatedMs\
            \ = a.g * 1000;\nconst coverageEnd = (a.t + a.n * a.d) * 1000;\nif (nowMs - generatedMs > 180000 || generatedMs\
            \ - nowMs > 120000 ||\n    nowMs >= coverageEnd) return [];\nconst values = a.w;\nconst points = [];\nfor (let\
            \ i = 0; i < a.n; ++i) {\n  const intervalStart = (a.t + i * a.d) * 1000;\n  const intervalEnd = intervalStart\
            \ + a.d * 1000;\n  const at = Math.max(intervalStart, generatedMs, windowStart, nowMs);\n  const end = Math.min(intervalEnd,\
            \ windowEnd);\n  if (end <= at) continue;\n  // Keep explicit null gaps and the full duration of adjacent known\
            \ intervals.\n  points.push([at, values[i]], [end, values[i]]);\n}\nreturn points;\n"
        - entity: sensor.solarlimiter_charge_plan
          name: PV-Prognose
          yaxis_id: solar_dc
          unit: W
          float_precision: 0
          type: line
          curve: stepline
          color: '#ffca28'
          opacity: 1
