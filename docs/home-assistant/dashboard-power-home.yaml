# Power dashboard (dashboard-power), view "Home".
# Source: live Home Assistant export (2026-11-13). Keep in sync with the live system.
# Live location: .storage/lovelace.dashboard_power, views[0].
# Install: dashboard edit mode -> three dots -> Raw configuration editor; paste as one item of `views:`.
# Required custom cards (HACS): apexcharts-card.js, bubble-card.js, card-mod.js, ha-sankey-chart.js, landroid-card.js, lovelace-expander-card.js, mini-graph-card-bundle.js, mushroom.js, power-flow-card-plus.js, slider-button-card.js, sunsynk-power-flow-card.js, tabbed-card.js, timer-bar-card.js

