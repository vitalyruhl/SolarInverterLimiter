- type: custom:apexcharts-card
  header:
    show: true
  graph_span: 96h
  span:
    start: day
  now:
    show: true
    label: Now
  color_list:
  - var(--primary-color)
  series:
  - entity: sensor.epex_spot_data_total_price_2
    yaxis_id: uurprijs
    float_precision: 3
    type: column
    extend_to: false
    show:
      extremas: time
    data_generator: |
      const data = entity.attributes.data ?? [];
      const startWindow = new Date();
      startWindow.setHours(0, 0, 0, 0);

      const endWindow = startWindow.getTime() + 96 * 60 * 60 * 1000;

      return data
        .filter(entry => {
          const start = new Date(entry.start_time).getTime();
          return start >= startWindow.getTime() && start < endWindow;
        })
        .map(entry => [
          new Date(entry.start_time).getTime(),
          Number(entry.price_per_kwh)
        ]);
    color_threshold:
    - value: 0
      color: '#186ddc'
    - value: 0.155
      color: '#04822e'
    - value: 0.2
      color: '#12A141'
    - value: 0.25
      color: '#79B92C'
    - value: 0.3
      color: '#C4D81D'
    - value: 0.35
      color: '#F3DC0C'
    - value: 0.4
      color: red
    - value: 0.5
      color: magenta
  experimental:
    color_threshold: true
  yaxis:
  - id: uurprijs
    decimals: 3
    apex_config:
      title:
        text: €/kWh
      tickAmount: 4
  apex_config:
    legend:
      show: false
    tooltip:
      x:
        show: true
        format: dd.MM. HH:mm
    xaxis:
      type: datetime
      labels:
        datetimeUTC: false
- type: vertical-stack
  cards:
  - type: markdown
    title: Strompreis · Gesamtpreis heute
    content: |-
      {% set day_start = today_at('00:00') %}
      {% set day_end = day_start + timedelta(days=1) %}
      {% set expected = ((as_timestamp(day_end) - as_timestamp(day_start)) / 900) | int %}
      {% set ns = namespace(prices=[], starts=[], invalid=false) %}
      {% for row in state_attr('sensor.epex_spot_data_total_price_2', 'data') or [] %}
        {% set start = as_datetime(row.start_time, none) %}
        {% set end = as_datetime(row.end_time, none) %}
        {% if start is not none and as_local(start).date() == now().date() %}
          {% if is_number(row.price_per_kwh) and end is not none and as_timestamp(end) - as_timestamp(start) == 900 %}
            {% set ns.prices = ns.prices + [row.price_per_kwh | float] %}
            {% set ns.starts = ns.starts + [as_timestamp(start)] %}
          {% else %}
            {% set ns.invalid = true %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {% set prices = ns.prices | sort %}
      {% set n = prices | count %}
      **Heute · {{ now().strftime('%d.%m.%Y') }} · 00:00–24:00 (Europe/Berlin)**

      {% if n == expected and ns.starts | unique | list | count == expected and not ns.invalid %}
      | Gesamtpreis inkl. Aufschlägen und Steuer | €/kWh |
      |:--|--:|
      | Durchschnitt heute | {{ ('%.6f' | format((prices | sum) / n)).replace('.', ',') }} |
      | Höchstpreis heute | {{ ('%.6f' | format(prices[-1])).replace('.', ',') }} |
      | Tiefstpreis heute | {{ ('%.6f' | format(prices[0])).replace('.', ',') }} |
      | Median heute | {{ ('%.6f' | format((prices[((n - 1) / 2) | int] + prices[(n / 2) | int]) / 2)).replace('.', ',') }} |

      {{ n }}/{{ expected }} Viertelstunden · gleiche Preisgrundlage wie die Grafik.
      {% else %}
      **Nicht verfügbar:** vollständige Tagesdaten fehlen ({{ n }}/{{ expected }} gültige Viertelstunden).
      {% endif %}
  - type: entities
    show_header_toggle: false
    entities:
    - entity: sensor.epex_spot_data_total_price_2
      name: Aktueller Gesamtpreis
    - entity: sensor.epex_spot_data_quantile_2
      name: Marktpreis-Quantil heute
    - entity: sensor.epex_spot_data_rank_2
      name: Marktpreis-Rang heute
- type: custom:apexcharts-card
  header:
    show: true
    title: Nächste 4 Stunden
  graph_span: 4h
  span:
    start: hour
  now:
    show: true
    label: Jetzt
  series:
  - entity: sensor.epex_spot_data_total_price_2
    yaxis_id: uurprijs
    float_precision: 3
    type: column
    extend_to: false
    data_generator: |
      const now = Date.now();
      const endWindow = now + 4 * 60 * 60 * 1000;
      const data = entity.attributes.data ?? [];

      const rows = data.filter(entry => {
        const start = new Date(entry.start_time).getTime();
        const end = new Date(entry.end_time).getTime();

        return end > now && start < endWindow;
      });

      return rows.map(entry => [
        new Date(entry.start_time).getTime(),
        Number(entry.price_per_kwh)
      ]);

      return result;
    color_threshold:
    - value: 0
      color: '#186ddc'
    - value: 0.155
      color: '#04822e'
    - value: 0.2
      color: '#12A141'
    - value: 0.25
      color: '#79B92C'
    - value: 0.3
      color: '#C4D81D'
    - value: 0.35
      color: '#F3DC0C'
    - value: 0.4
      color: red
    - value: 0.5
      color: magenta
  experimental:
    color_threshold: true
  yaxis:
  - id: uurprijs
    decimals: 3
    min: -0.2
    max: 0.8
    apex_config:
      title:
        text: €/kWh
      tickAmount: 4
  apex_config:
    chart:
      type: bar
    plotOptions:
      bar:
        columnWidth: 90%
    legend:
      show: false
    tooltip:
      x:
        show: true
        format: HH:mm
