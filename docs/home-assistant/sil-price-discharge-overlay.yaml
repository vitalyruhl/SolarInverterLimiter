# Local 5.2.0 example; requires the matching discharge-budget MQTT sensor.
# Battery budget is planned AC contribution, not measured discharge or full inverter demand.
type: custom:apexcharts-card
header:
  show: false
graph_span: 24h
span:
  start: hour
now:
  show: true
  label: Now
series:
  - entity: sensor.solarlimiter_discharge_budget
    name: Planned battery discharge budget
    yaxis_id: discharge_w
    unit: W
    float_precision: 0
    type: area
    curve: stepline
    color: '#7d8fa9'
    opacity: 0.22
    stroke_width: 1
    extend_to: false
    show:
      extremas: false
    data_generator: |
      const currentHour = new Date();
      currentHour.setMinutes(0, 0, 0);
      const windowStart = currentHour.getTime();
      const windowEnd = windowStart + 24 * 60 * 60 * 1000;
      const nowMs = Date.now();
      const a = entity.attributes;
      if (entity.state !== 'ready' || a.valid !== true || a.v !== 1 ||
          !Number.isInteger(a.g) || !Number.isInteger(a.t) || a.d !== 900 ||
          !Number.isInteger(a.n) || a.n < 2 || a.n > 144 ||
          !Array.isArray(a.w) || a.w.length !== a.n ||
          a.t % 900 !== 0 || a.g < a.t || a.g >= a.t + a.d ||
          a.w.some(w => !Number.isInteger(w) || w < 0)) return [];
      const generatedMs = a.g * 1000;
      const coverageEnd = (a.t + a.n * a.d) * 1000;
      if (nowMs - generatedMs > 180000 || generatedMs - nowMs > 120000 ||
          nowMs >= coverageEnd) return [];
      const points = [];
      for (let i = 0; i < a.n; ++i) {
        const intervalStart = (a.t + i * a.d) * 1000;
        const intervalEnd = intervalStart + a.d * 1000;
        const at = Math.max(intervalStart, generatedMs, windowStart);
        if (intervalEnd <= at || at >= windowEnd) continue;
        points.push([at, a.w[i]]);
      }
      if (points.length) {
        const end = Math.min(coverageEnd, windowEnd);
        const last = points[points.length - 1];
        if (end > last[0]) points.push([end, last[1]]);
      }
      return points;
  - entity: sensor.epex_spot_data_total_price_2
    yaxis_id: uurprijs
    float_precision: 3
    type: line
    curve: stepline
    extend_to: false
    show:
      extremas: true
    data_generator: |
      const currentHour = new Date();
      currentHour.setMinutes(0, 0, 0);
      const windowStart = currentHour.getTime();
      const windowEnd = windowStart + 24 * 60 * 60 * 1000;
      return entity.attributes.data
        .filter(entry => {
          const at = new Date(entry.start_time).getTime();
          return at >= windowStart && at < windowEnd;
        })
        .map(entry => [new Date(entry.start_time).getTime(), entry.price_per_kwh]);
    color_threshold:
      - value: 0
        color: '#186ddc'
      - value: 0.155
        color: '#04822e'
      - value: 0.2
        color: '#12A141'
      - value: 0.25
        color: '#79B92C'
      - value: 0.3
        color: '#C4D81D'
      - value: 0.35
        color: '#F3DC0C'
      - value: 0.4
        color: red
      - value: 0.5
        color: magenta
experimental:
  color_threshold: true
yaxis:
  - id: uurprijs
    decimals: 3
    min: 0
    apex_config:
      title:
        text: €/kWh
      tickAmount: 4
  - id: discharge_w
    opposite: true
    decimals: 0
    min: 0
    apex_config:
      title:
        text: W
      tickAmount: 4
apex_config:
  chart:
    animations:
      enabled: false
  stroke:
    width: 4
    curve: stepline
  markers:
    size: 0
  legend:
    show: false
  tooltip:
    x:
      show: true
      format: dd.MM. HH:mm
  xaxis:
    type: datetime
    labels:
      datetimeUTC: false
