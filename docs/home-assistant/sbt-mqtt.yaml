  - name: SBT BMS State of charge
    unique_id: sbt_bms_state_of_charge_pct
    default_entity_id: sensor.sbt_bms_state_of_charge_pct
    state_topic: SolarBatteryTelemetry/bms/state_of_charge_pct
    availability_mode: all
    availability:
    - topic: SolarBatteryTelemetry/status
      payload_available: online
      payload_not_available: offline
    - topic: SolarBatteryTelemetry/bms/availability
      payload_available: available
      payload_not_available: unavailable
    device:
      identifiers:
      - sbt_8857218f664c_bms
      name: SBT BMS
      manufacturer: SolarBatteryTelemetry
    value_template: '{{ value_json }}'
    unit_of_measurement: '%'
    state_class: measurement
    device_class: battery
