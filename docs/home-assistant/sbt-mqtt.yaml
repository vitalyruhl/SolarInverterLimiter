# SolarBatteryTelemetry (SBT) MQTT entities: JK BMS and Victron SmartSolar data used by
# the Overview and Power dashboards.
# Source: live Home Assistant export (2026-11-13). Keep in sync with the live system.
# Live location: /config/mqttsensors.yaml (included as `mqtt:` in configuration.yaml).
# Merge these entries into your existing mqtt sections; do not replace other entities.
# Cell voltages, collector uptime and runtime diagnostics come from retained MQTT
# discovery; see mqtt-discovery.json.

mqtt:
