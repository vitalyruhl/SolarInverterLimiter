  - type: markdown
    content: >-
      {% set e = 'sensor.solarlimiter_discharge_budget' %}

      {% set w = state_attr(e, 'w') or [] %}

      {% set stamp = state_attr(e, 'g') | int(0) %}

      {% if states(e) == 'ready' and stamp > 0 and as_timestamp(now()) - stamp <
      180 %}

      **Plan aktuell** · Stand {{ stamp | timestamp_custom('%d.%m. %H:%M:%S') }}

      {% if (w | max if w else 0) == 0 %}      **keine Batterieentladung
      eingeplant**.{% else %}SIL Batterieenergie einlagert – bis zu **{{ w | max
      }} W**.

      {% endif %}

      {% else %}

      **Noch kein aktueller, gültiger Entladeplan.**

      {% endif %}
grid_options:
  columns: full
