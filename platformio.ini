; Shared firmware settings; environment sections contain only profile differences.
[platformio]
description = esp32 to calculate inverter-setvalue

[env]
platform = platformio/espressif32@7.0.1
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
	-Wno-deprecated-declarations
	-std=gnu++17
	-flto
	-DUNIT_TEST
	-DCM_ENABLE_LOGGING=0
	-DCM_ENABLE_VERBOSE_LOGGING=0
	-DCM_DISABLE_GUI_LOGGING=1
	-DFEATURE_OLED_DISPLAY_ENABLED=0
	-DFEATURE_MQTT_LOGGER_ENABLED=0
lib_deps =
	knolleary/PubSubClient@^2.8
	ks-tec/BME280_I2C@1.4.1+002
	bblanchon/ArduinoJson@7.4.3
	esphome/ESPAsyncWebServer-esphome@^3.4.0
	symlink://../ConfigurationsManager
test_ignore = src/main.cpp
extra_scripts =
	pre:./tools/precompile_wrapper.py
	post:./tools/enable_lto.py

[env:usb]
upload_port = COM7
monitor_port = COM7

[env:ota]
upload_protocol = espota
upload_port = 192.168.2.122
upload_flags =
	-a
	otaSI
	-t
	30

[env:ota_no_oled]
extends = env:ota
build_flags =
	${env.build_flags}
	-DFEATURE_OLED_DISPLAY_ENABLED=0
	-DFEATURE_MQTT_LOGGER_ENABLED=0

[env:ota_no_oled_no_bme]
extends = env:ota_no_oled
build_flags =
	${env:ota_no_oled.build_flags}
	-DFEATURE_BME280_ENABLED=0

[env:testesp]
extends = env:usb
upload_port = COM7
monitor_port = COM7
build_flags =
	${env.build_flags}
	-DSIL_MOCK_TRANSPORT=1
	-DCM_ENABLE_LOGGING=1
	-DCM_ENABLE_VERBOSE_LOGGING=1
